<!doctype html>
<html lang="ru" data-style="glassmorphism">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="style.metaTitle">Диапазон — glassmorphism</title>
  <meta name="description" data-i18n-attr="content:meta.description">
  <meta name="theme-color" content="#0B3C49">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFC857'/%3E%3Cstop offset='.5' stop-color='%23FF7A45'/%3E%3Cstop offset='1' stop-color='%232EC4B6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230B3C49'/%3E%3Ccircle cx='16' cy='16.5' r='9.5' fill='url(%23g)'/%3E%3Cellipse cx='12.6' cy='12.4' rx='3.6' ry='2.3' fill='%23fff' fill-opacity='.72'/%3E%3C/svg%3E">
  <!-- boot: read the reveal origin left by the previous page (must stay inline, in <head>) -->
  <script>(function(d){try{var o=JSON.parse(sessionStorage.getItem('diapason.vt')||'null');sessionStorage.removeItem('diapason.vt');if(o){d.documentElement.style.setProperty('--dz-vt-x',o.x+'px');d.documentElement.style.setProperty('--dz-vt-y',o.y+'px');}}catch(e){}})(document)</script>
  <script>document.documentElement.classList.add('lg-js');</script>
  <link rel="stylesheet" href="assets/core/core.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV@-12..0,200..700,0..1&display=swap">
  <link rel="stylesheet" href="assets/glassmorphism/style.css">
</head>
<body>
  <a class="dz-skip" href="#main" data-i18n="a11y.skip"></a>

  <!-- living light: a low-res WebGL caustics field, upscaled; CSS gradients underneath as a fallback -->
  <div class="bg" aria-hidden="true">
    <canvas class="bg__gl"></canvas>
    <div class="bg__grain"></div>
  </div>

  <!-- liquid glass: displacement filters are generated per element size by script.js -->
  <svg class="lg-defs" aria-hidden="true" focusable="false" width="0" height="0"><defs id="lg-defs"></defs></svg>

  <header class="site-header glass-bar">
    <a class="brand" href="#top">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">
        <span class="brand__name" data-i18n="brand.name"></span>
        <span class="brand__descriptor" data-i18n="brand.descriptor"></span>
      </span>
    </a>
    <div class="header-sheet">
      <div class="header-sheet__inner">
        <nav class="site-nav" id="site-nav" data-i18n-attr="aria-label:a11y.menu">
          <span class="nav-capsule" aria-hidden="true"></span>
          <ul>
            <template data-i18n-list="nav.items">
              <li><a href="{@href}" data-i18n="@label"></a></li>
            </template>
          </ul>
        </nav>
        <a class="header-cta btn btn--sun btn--sm" href="#contact" data-i18n="nav.cta"></a>
      </div>
    </div>
    <div class="lang" role="group" data-i18n-attr="aria-label:a11y.lang">
      <span class="lang__thumb" aria-hidden="true"></span>
      <button type="button" data-set-lang="ru" data-i18n="lang.ru" data-i18n-attr="aria-label:lang.ruFull"></button>
      <button type="button" data-set-lang="en" data-i18n="lang.en" data-i18n-attr="aria-label:lang.enFull"></button>
    </div>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" data-i18n-attr="aria-label:a11y.menu">
      <span class="menu-btn__bars" aria-hidden="true"><span></span><span></span></span>
    </button>
  </header>

  <main id="main">
    <!-- HERO -->
    <section id="top" class="hero">
      <div class="hero__floaters" aria-hidden="true">
        <span class="floater floater--a"></span>
        <span class="floater floater--b"></span>
        <span class="floater floater--c"></span>
      </div>

      <div class="container hero__inner">
        <div class="hero__top intro intro--1">
          <p class="hero__eyebrow"><span class="hero__eyebrow-dot" aria-hidden="true"></span><span data-i18n="hero.eyebrow"></span></p>
          <p class="lens-tag" aria-hidden="true">
            <span class="lens-tag__drop"></span>
            <span class="only-pointer" data-i18n="x.glassmorphism.lens.pointer"></span>
            <span class="only-touch" data-i18n="x.glassmorphism.lens.touch"></span>
          </p>
        </div>

        <h1 class="hero__title">
          <span class="hero__line intro intro--2" data-i18n="hero.title"></span>
          <span class="hero__this intro intro--3" data-i18n="style.hero"></span>
        </h1>

        <div class="hero__row">
          <p class="hero__lead intro intro--4" data-i18n="hero.lead"></p>
          <div class="hero__cta intro intro--5">
            <div class="hero__actions">
              <a class="btn btn--sun" href="#contact"><span data-i18n="hero.ctaPrimary"></span><svg class="btn__arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5 15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
              <a class="btn btn--glass" href="#work"><span data-i18n="hero.ctaSecondary"></span></a>
            </div>
            <p class="hero__hint">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v12M5.5 11 10 15.5 14.5 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span data-i18n="hero.switchHint"></span>
            </p>
          </div>
        </div>

        <dl class="stats glass intro intro--6">
          <template data-i18n-list="hero.stats">
            <div class="stat"><dt data-i18n="@value"></dt><dd data-i18n="@label"></dd></div>
          </template>
        </dl>
      </div>

      <!-- the droplet: refracts whatever lies beneath it -->
      <div class="lens-caustic" aria-hidden="true"></div>
      <div class="lens" aria-hidden="true">
        <span class="lens__shade"></span>
        <span class="lens__glint"></span>
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="section" aria-labelledby="services-title">
      <div class="container">
        <header class="sec-head">
          <div class="sec-head__main">
            <p class="section-num rv"><span class="section-num__n" data-i18n="services.num"></span><span class="section-num__label" data-i18n="nav.items.0.label"></span></p>
            <h2 id="services-title" class="sec-title rv" data-i18n="services.title"></h2>
          </div>
          <p class="section-lead rv" data-i18n="services.lead"></p>
        </header>

        <div class="services-panel glass rv">
          <span class="svc-capsule" aria-hidden="true"></span>
          <ol class="services">
            <template data-i18n-list="services.items">
              <li class="service">
                <span class="service__num">{nn}</span>
                <h3 class="service__title" data-i18n="@title"></h3>
                <p class="service__text" data-i18n="@text"></p>
                <span class="service__meta" data-i18n="@meta"></span>
              </li>
            </template>
          </ol>
        </div>
      </div>
    </section>

    <!-- WORK -->
    <section id="work" class="section" aria-labelledby="work-title">
      <div class="container">
        <header class="sec-head">
          <div class="sec-head__main">
            <p class="section-num rv"><span class="section-num__n" data-i18n="work.num"></span><span class="section-num__label" data-i18n="nav.items.1.label"></span></p>
            <h2 id="work-title" class="sec-title rv" data-i18n="work.title"></h2>
          </div>
          <p class="section-lead rv" data-i18n="work.lead"></p>
        </header>

        <ul class="cases">
          <template data-i18n-list="work.items">
            <li class="case glass tilt rv" data-motif="{@motif}">
              <div class="case__art" aria-hidden="true"></div>
              <div class="case__body">
                <p class="case__type" data-i18n="@type"></p>
                <h3 class="case__name" data-i18n="@name"></h3>
                <p class="case__text" data-i18n="@text"></p>
                <ul class="case__tags">
                  <template data-i18n-list="@tags"><li data-i18n="@"></li></template>
                </ul>
              </div>
              <span class="case__year" data-i18n="work.year"></span>
            </li>
          </template>
        </ul>

        <div class="cases-meta" aria-hidden="true">
          <span class="cases-meta__count"><b class="cases-meta__i">01</b> / 06</span>
          <span class="cases-meta__bar"><span></span></span>
          <span class="cases-meta__swipe" data-i18n="x.glassmorphism.swipe"></span>
        </div>

        <p class="work__more rv"><span class="work__more-drop" aria-hidden="true"></span><span data-i18n="work.more"></span></p>
      </div>
    </section>

    <!-- PROCESS -->
    <section id="process" class="section" aria-labelledby="process-title">
      <div class="container">
        <header class="sec-head">
          <div class="sec-head__main">
            <p class="section-num rv"><span class="section-num__n" data-i18n="process.num"></span><span class="section-num__label" data-i18n="nav.items.2.label"></span></p>
            <h2 id="process-title" class="sec-title rv" data-i18n="process.title"></h2>
          </div>
          <p class="section-lead rv" data-i18n="process.lead"></p>
        </header>

        <div class="process">
          <p class="rail-hint" aria-hidden="true"><span class="rail-hint__drop"></span><span data-i18n="x.glassmorphism.process.hint"></span></p>
          <div class="rail" aria-hidden="true"><span class="rail__fill"></span><span class="rail__ticks"></span></div>
          <span class="rail__bubble" role="slider" tabindex="0" aria-orientation="horizontal" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" data-i18n-attr="aria-label:x.glassmorphism.process.slider"><span class="rail__glint" aria-hidden="true"></span></span>
          <ol class="steps">
            <template data-i18n-list="process.steps">
              <li class="step glass rv">
                <span class="step__node" aria-hidden="true"></span>
                <span class="step__num">{nn}</span>
                <h3 class="step__title" data-i18n="@title"></h3>
                <p class="step__text" data-i18n="@text"></p>
                <span class="step__duration"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4.2l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span data-i18n="@duration"></span></span>
              </li>
            </template>
          </ol>
        </div>
      </div>
    </section>

    <!-- PRICING -->
    <section id="pricing" class="section" aria-labelledby="pricing-title">
      <div class="container">
        <header class="sec-head sec-head--center">
          <div class="sec-head__main">
            <p class="section-num rv"><span class="section-num__n" data-i18n="pricing.num"></span><span class="section-num__label" data-i18n="nav.items.3.label"></span></p>
            <h2 id="pricing-title" class="sec-title rv" data-i18n="pricing.title"></h2>
          </div>
          <p class="section-lead rv" data-i18n="pricing.lead"></p>
        </header>

        <div class="pricing-stage">
          <div class="pricing-light" aria-hidden="true"><span class="pricing-light__sea"></span><span class="pricing-light__ring"></span><span class="pricing-light__sun"></span><span class="pricing-light__disc"></span></div>
          <div class="plans">
          <template data-i18n-list="pricing.plans">
            <article class="plan glass tilt rv" data-featured="{@featured}">
              <p class="plan__badge" data-i18n="@badge"></p>
              <h3 class="plan__name" data-i18n="@name"></h3>
              <p class="plan__text" data-i18n="@text"></p>
              <p class="plan__price" data-i18n="@price"></p>
              <p class="plan__term" data-i18n="@term"></p>
              <ul class="plan__features">
                <template data-i18n-list="@features"><li data-i18n="@"></li></template>
              </ul>
              <a class="btn plan__cta" href="#contact" data-i18n="pricing.cta"></a>
            </article>
          </template>
          </div>
          <div class="cases-meta plans-meta" aria-hidden="true">
            <span class="cases-meta__count"><b class="cases-meta__i">01</b> / 03</span>
            <span class="cases-meta__bar"><span></span></span>
            <span class="cases-meta__swipe" data-i18n="x.glassmorphism.swipe"></span>
          </div>
        </div>
        <p class="pricing__note rv"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4.6M10 6.4v.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span data-i18n="pricing.note"></span></p>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" class="section" aria-labelledby="faq-title">
      <div class="container faq-layout">
        <header class="sec-head sec-head--stack">
          <p class="section-num rv"><span class="section-num__n" data-i18n="faq.num"></span><span class="section-num__label" data-i18n="nav.items.4.label"></span></p>
          <h2 id="faq-title" class="sec-title rv" data-i18n="faq.title"></h2>
          <p class="section-lead rv" data-i18n="faq.lead"></p>
        </header>
        <div class="faq">
          <template data-i18n-list="faq.items">
            <details class="faq__item glass rv" name="faq">
              <summary><span class="faq__q" data-i18n="@q"></span><span class="faq__icon" aria-hidden="true"></span></summary>
              <div class="faq__a"><p data-i18n="@a"></p></div>
            </details>
          </template>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section" aria-labelledby="contact-title">
      <div class="container">
        <div class="contact glass glass--thick rv">
          <div class="contact__intro">
            <p class="section-num"><span class="section-num__n" data-i18n="contact.num"></span><span class="section-num__label" data-i18n="nav.items.5.label"></span></p>
            <h2 id="contact-title" class="sec-title" data-i18n="contact.title"></h2>
            <p class="section-lead" data-i18n="contact.lead"></p>
            <dl class="contact__details">
              <template data-i18n-list="contact.details">
                <div><dt data-i18n="@label"></dt><dd data-i18n="@value"></dd></div>
              </template>
            </dl>
          </div>

          <form class="form" data-dz-form novalidate>
            <div class="field">
              <label for="f-name" data-i18n="contact.form.name.label"></label>
              <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-err" data-i18n-attr="placeholder:contact.form.name.placeholder">
              <p id="f-name-err" class="field__error" data-error-for="name" hidden></p>
            </div>
            <div class="field">
              <label for="f-contact" data-i18n="contact.form.contact.label"></label>
              <input id="f-contact" name="contact" type="text" autocomplete="email" required aria-describedby="f-contact-err" data-i18n-attr="placeholder:contact.form.contact.placeholder">
              <p id="f-contact-err" class="field__error" data-error-for="contact" hidden></p>
            </div>
            <fieldset class="field chips chips--type">
              <legend data-i18n="contact.form.type.label"></legend>
              <template data-i18n-list="contact.form.type.options">
                <label class="chip"><input type="checkbox" name="type" data-i18n-attr="value:@"><span class="chip__tick" aria-hidden="true"></span><span data-i18n="@"></span></label>
              </template>
            </fieldset>
            <fieldset class="field chips chips--budget">
              <legend data-i18n="contact.form.budget.label"></legend>
              <template data-i18n-list="contact.form.budget.options">
                <label class="chip"><input type="radio" name="budget" data-i18n-attr="value:@"><span class="chip__tick" aria-hidden="true"></span><span data-i18n="@"></span></label>
              </template>
            </fieldset>
            <div class="field field--wide">
              <label for="f-message" data-i18n="contact.form.message.label"></label>
              <textarea id="f-message" name="message" rows="4" data-i18n-attr="placeholder:contact.form.message.placeholder"></textarea>
            </div>
            <div class="form__foot">
              <button class="btn btn--sun btn--submit" type="submit"><span data-i18n="contact.form.submit"></span><span class="btn__drop" aria-hidden="true"></span></button>
              <p class="form__privacy" data-i18n="contact.form.privacy"></p>
            </div>

            <div class="form__success" data-form-success hidden role="status">
              <svg class="form__success-mark" viewBox="0 0 96 96" aria-hidden="true">
                <defs>
                  <radialGradient id="okDrop" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".45" stop-color="#FFC857"/><stop offset="1" stop-color="#FF7A45"/></radialGradient>
                </defs>
                <circle cx="48" cy="48" r="40" fill="url(#okDrop)"/>
                <ellipse cx="36" cy="30" rx="13" ry="7" fill="#fff" fill-opacity=".55" transform="rotate(-24 36 30)"/>
                <path class="form__success-tick" d="M31 49.5 43 61l23-26" fill="none" stroke="#0B3C49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <p class="form__success-title" data-i18n="contact.form.success.title"></p>
              <p class="form__success-text" data-i18n="contact.form.success.text" data-i18n-vars="{}"></p>
              <p class="form__success-note" data-i18n="contact.form.success.note"></p>
              <button type="button" class="btn btn--glass" data-form-reset data-i18n="contact.form.success.again"></button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer glass rv">
        <div class="footer__brand">
          <p class="brand__name footer__word" data-i18n="brand.name"></p>
          <p class="footer__tagline" data-i18n="brand.tagline"></p>
          <p class="footer__made" data-i18n="x.glassmorphism.made"></p>
        </div>

        <section class="colophon" aria-labelledby="colophon-title">
          <h2 id="colophon-title" data-i18n="footer.colophon"></h2>
          <p class="colophon__style"><strong data-i18n="style.name"></strong> — <span data-i18n="style.desc"></span></p>
          <p class="colophon__fonts"><span data-i18n="footer.fontsLabel"></span>: <span data-i18n="style.fonts"></span></p>
          <p class="colophon__label" data-i18n="footer.paletteLabel"></p>
          <ul class="swatches">
            <template data-i18n-list="style.palette">
              <li style="--swatch: {@hex}"><span class="swatch" aria-hidden="true"></span><span class="swatch__name" data-i18n="@name"></span> <code>{@hex}</code></li>
            </template>
          </ul>
          <p class="engine"><span class="engine__dot" aria-hidden="true"></span><span class="engine__text" data-i18n="x.glassmorphism.engine.frosted"></span></p>
        </section>

        <div class="footer__bar">
          <a class="footer__link" href="index.html" data-dz-go="hub" data-i18n="footer.hub"></a>
          <a class="footer__link footer__link--top" href="#top" data-i18n="footer.toTop"></a>
          <p class="footer__rights" data-i18n="footer.rights"></p>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/core/content.js"></script>
  <script src="assets/glassmorphism/copy.js"></script>
  <script src="assets/core/core.js"></script>
  <script src="assets/glassmorphism/script.js"></script>
</body>
</html>
